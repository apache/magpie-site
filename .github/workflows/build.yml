name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so the published site picks up docs changed in apache/magpie
  # even when nothing here is pushed, and the full gate runs against main.
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes the run in progress: only the latest commit's build
# is worth deploying, and the deploy's force-push of "publish" is atomic.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ship the published site (built from main) with the review overlay: one
  # "Comment / Suggest a change" button, where a comment marks a region,
  # copies a screenshot and opens a new issue linking the source on main.
  # "false" publishes exactly the plain production build.
  MAIN_REVIEW_OVERLAY: "true"

jobs:
  # Lint and the browser suites gate pull requests and the weekly run; a push
  # to main has already passed them on its PR, so it only builds and deploys.
  # playwright-cache.yml keeps the browser suites' apt cache fresh.
  lint:
    if: github.event_name != 'push'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      # Oxc raw transfer reserves a 6 GiB buffer and fails on this small runner.
      # Use the normal parser with the same checks: https://knip.dev/reference/known-issues#raw-transfer-memory-errors
      KNIP_DISABLE_RAW_TRANSFER: "1"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      # The tests were previously run without installing anything, which
      # worked only for as long as every test imported Node built-ins alone.
      # The first test to import a real dependency failed with
      # ERR_MODULE_NOT_FOUND, which reads as a missing dependency rather than
      # a missing install step. `build` below has always done this.
      - name: Install dependencies
        run: npm ci

      - name: Sync docs for the static gate
        run: npm run sync-docs

      - name: Run prek (zizmor + security/hygiene hooks)
        run: |
          uv tool install prek
          prek run --all-files --color always

  # What a pull request needs, from the files it changes: a preview when it
  # changes the site (.github/site-paths.txt), and the browser suites when it
  # changes the site or the suites (.github/browser-test-paths.txt). One
  # decision for both, so they cannot drift apart. Other events run everything.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # list the PR's changed files
    outputs:
      site: ${{ steps.decide.outputs.site }}
      browser: ${{ steps.decide.outputs.browser }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts

      - name: Decide what this pull request needs
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-changes.mjs

  # The browser suites, as their own workflow so their 22 matrix jobs are
  # grouped under one "browser" entry in the checks list. They start once
  # `changes` has decided, not after lint: they are the longest part of the
  # run, and `build` still waits for both. Skipped on a pull request that
  # changes neither the site nor the suites; the weekly run covers main.
  browser:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'push' && (github.event_name != 'pull_request' || needs.changes.outputs.browser == 'true') }}
    permissions:
      contents: read
    uses: $/.github/workflows/browser-tests.yml

  build:
    # `changes` is a need of its own: if it fails, browser is skipped rather
    # than failed, and only this keeps a broken decision from passing the PR.
    needs: [changes, lint, browser]
    # Run when lint and browser passed, or were skipped. A shard that hits its
    # timeout ends "cancelled", not "failure", so !failure() alone would let
    # the build through.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # list the PR's changed files for the preview anchors
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's head, not the default merge commit: the diff anchors use
          # the head's line numbers, and a merge would shift the stamped lines
          # wherever main changed the same file.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync docs from apache/magpie
        env:
          MAGPIE_DOCS_REPO: https://github.com/apache/magpie.git
          MAGPIE_DOCS_BRANCH: main
        run: npm run sync-docs

      - name: Type check
        # No longer continue-on-error: the tree is clean of errors, warnings and
        # hints, so anything this reports from here on is a regression someone
        # introduced. astro check only fails the step on errors — warnings and
        # hints still print without blocking.
        run: npx astro check

      - name: Build
        run: npm run build

      # Fails if the plain build carries any preview annotation, then hands the
      # annotated builds below their Vite plugin. With MAIN_REVIEW_OVERLAY on,
      # the published site is rebuilt annotated on purpose.
      - name: Switch on source annotation
        id: annotate
        uses: apache/infrastructure-actions/website-comment/preview-annotate@65a538352531210f043ebee7cb6f87d3773a73e2 # preview-annotate/v1.0.0
        with:
          generator: astro
          production-output: dist

      - name: Build the published site annotated
        if: github.ref == 'refs/heads/main' && env.MAIN_REVIEW_OVERLAY == 'true'
        env:
          PREVIEW_ANNOTATE: "1"
          PREVIEW_VITE_PLUGIN: ${{ steps.annotate.outputs.vite-plugin }}
        run: npm run build

      # The docs pages are synced from apache/magpie, so their source lines
      # cannot be linked here; the issue carries only the page for those.
      - name: Add the review overlay to the published site
        if: github.ref == 'refs/heads/main' && env.MAIN_REVIEW_OVERLAY == 'true'
        uses: apache/infrastructure-actions/website-comment/preview-main-overlay@9ef89ae3b50c5a404b06e200efaa6143dad61d83 # preview-main-overlay/v1.1.0
        with:
          path: dist
          generated: src/content/docs/

      - name: Build the preview site with source annotation
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_ANNOTATE: "1"
          PREVIEW_VITE_PLUGIN: ${{ steps.annotate.outputs.vite-plugin }}
        run: npm run build

      # Writes preview-meta.json, with the anchor manifest derived from the PR's
      # diff here rather than in the privileged publisher, which never reads
      # pull-request content, and uploads dist (dotfiles included: .htaccess
      # carries the 404 handler) as the preview-site artifact.
      #
      # Only when the PR changes what the site is built from, as `changes`
      # decided: one that touches only CI, tests or repository settings has
      # nothing new to preview, and preview-publish.yml then posts no
      # explainer for it.
      - name: Upload the preview
        if: github.event_name == 'pull_request' && needs.changes.outputs.site == 'true'
        uses: apache/infrastructure-actions/website-comment/preview-artifact@9ef89ae3b50c5a404b06e200efaa6143dad61d83 # preview-artifact/v1.1.0
        with:
          path: dist

      - name: Upload site artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          retention-days: 1
          # dist/.htaccess is a dotfile and carries the site's 404 handler and
          # the text/markdown headers for llms.txt. Without this it is silently
          # dropped on the round-trip through the artifact.
          include-hidden-files: true

  # The one required check (.asf.yaml). It always runs, and fails when any job
  # before it failed or was cancelled: build is skipped when a need fails, and
  # a skipped job counts as passing, so build alone cannot be required. Jobs
  # skipped on purpose (lint and the browser suites on a push, the suites on a
  # PR that changes neither the site nor the tests) are fine.
  ci-passed:
    needs: [changes, lint, browser, build]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check that no job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes, lint, browser, build: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac

  deploy:
    needs: build
    # The skipped lint and browser jobs upstream of build would otherwise skip
    # this job too.
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      - name: Publish site to "publish" branch
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Carry the ASF publish config into the generated branch so infra
          # serves it at https://magpie.apache.org/ (whoami: publish).
          cp .asf.yaml dist/.asf.yaml
          cd dist
          git init -q
          git checkout -q -b publish
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" publish
