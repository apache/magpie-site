name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Ship the published site (built from main) with the review overlay: one
  # "Comment / Suggest a change" button, where a comment marks a region,
  # copies a screenshot and opens a new issue linking the source on main.
  # "false" publishes exactly the plain production build.
  MAIN_REVIEW_OVERLAY: "true"

jobs:
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      # Oxc raw transfer reserves a 6 GiB buffer and fails on this small runner.
      # Use the normal parser with the same checks: https://knip.dev/reference/known-issues#raw-transfer-memory-errors
      KNIP_DISABLE_RAW_TRANSFER: "1"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      # The tests were previously run without installing anything, which
      # worked only for as long as every test imported Node built-ins alone.
      # The first test to import a real dependency failed with
      # ERR_MODULE_NOT_FOUND, which reads as a missing dependency rather than
      # a missing install step. `build` below has always done this.
      - name: Install dependencies
        run: npm ci

      - name: Sync docs for the static gate
        run: npm run sync-docs

      - name: Run prek (zizmor + security/hygiene hooks)
        run: |
          uv tool install prek
          prek run --all-files --color always

  # The Jekyll source-annotation plugin for PR previews. This site is Astro, so
  # nothing else here builds Jekyll; the test builds a fixture site with the
  # plugin loaded. It runs on ubuntu-slim, which cannot start a job container,
  # so Ruby comes from apt rather than a Ruby image, and no third-party
  # setup-ruby action is added.
  jekyll-adapter:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Install exactly what the lockfile names, checksums included, and fail
      # rather than re-resolve if the Gemfile and lockfile disagree.
      BUNDLE_GEMFILE: scripts/preview/adapters/jekyll/test/Gemfile
      BUNDLE_FROZEN: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # eventmachine and friends build native extensions, hence the toolchain.
      - name: Install Ruby, Bundler and a C toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ruby-full ruby-bundler build-essential
          ruby --version

      # A writable gem home, so Bundler can switch itself to the version the
      # lockfile's BUNDLED WITH names, instead of an unpinned `gem install`.
      - name: Use a user gem home
        run: |
          echo "GEM_HOME=$RUNNER_TEMP/gems" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gems/bin" >> "$GITHUB_PATH"

      - name: Install the locked test dependencies
        run: bundle install

      - name: Test the Jekyll adapter
        run: bundle exec ruby scripts/preview/adapters/jekyll/test/magpie_src_test.rb

  browser:
    needs: lint
    runs-on: ubuntu-latest
    # Full route coverage and the separate dev-preview suite both run here.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run sync-docs
      - run: npm run test:browser
      - run: npm run test:dev

  build:
    needs: [lint, browser]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # list the PR's changed files for the preview anchors
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync docs from apache/magpie
        env:
          MAGPIE_DOCS_REPO: https://github.com/apache/magpie.git
          MAGPIE_DOCS_BRANCH: main
        run: npm run sync-docs

      - name: Type check
        # No longer continue-on-error: the tree is clean of errors, warnings and
        # hints, so anything this reports from here on is a regression someone
        # introduced. astro check only fails the step on errors — warnings and
        # hints still print without blocking.
        run: npx astro check

      - name: Build
        run: npm run build

      # Checks the plain build. With MAIN_REVIEW_OVERLAY on, the published site
      # is then rebuilt annotated on purpose, in the next step.
      - name: Assert the production build carries no preview annotation
        run: |
          if grep -rq "data-magpie-src" dist/; then
            echo "::error::data-magpie-src found in a production build — it must never ship to magpie.apache.org"
            grep -rl "data-magpie-src" dist/ | head -20
            exit 1
          fi
          echo "production build is clean of preview annotation"

      - name: Build the published site with the review overlay
        if: github.ref == 'refs/heads/main' && env.MAIN_REVIEW_OVERLAY == 'true'
        env:
          MAGPIE_PREVIEW_ANNOTATE: "1"
        run: |
          npm run build
          node scripts/preview/inject-main.mjs dist

      - name: Build the preview site with source annotation
        if: github.event_name == 'pull_request'
        env:
          MAGPIE_PREVIEW_ANNOTATE: "1"
        run: npm run build

      # Includes the anchor manifest, derived from the PR's diff here rather than
      # in the privileged publisher, which never reads pull-request content.
      - name: Write preview metadata
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUT: dist/preview-meta.json
        run: node scripts/preview/write-meta.mjs

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-site
          path: dist
          retention-days: 30
          # dist/.htaccess is a dotfile and carries the site's 404 handler and
          # the text/markdown headers for llms.txt. Without this it is silently
          # dropped on the round-trip through the artifact.
          include-hidden-files: true

      - name: Upload site artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist
          retention-days: 1
          # dist/.htaccess is a dotfile and carries the site's 404 handler and
          # the text/markdown headers for llms.txt. Without this it is silently
          # dropped on the round-trip through the artifact.
          include-hidden-files: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist

      - name: Publish site to "publish" branch
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Carry the ASF publish config into the generated branch so infra
          # serves it at https://magpie.apache.org/ (whoami: publish).
          cp .asf.yaml dist/.asf.yaml
          cd dist
          git init -q
          git checkout -q -b publish
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" publish
