---
# The browser suites, called from build.yml. A separate workflow only so the
# matrix is grouped under the caller's "browser" job in the checks list.
name: "Browser tests"
"on":
  workflow_call:

permissions:
  contents: read

jobs:
  # Full route coverage (test:browser) in 20 shards, plus the dev-preview suite
  # (test:dev) in 2 more ("dev 1/2", "dev 2/2"). ubuntu-slim has one CPU and
  # stops a job at 15 minutes, so each shard runs one worker. Keep each shard's
  # tests under 8 minutes; add shards as the suite grows.
  browser:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      # Where the playwright-chromium action caches the browser.
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
    strategy:
      fail-fast: false
      matrix:
        suite: ["1/20", "2/20", "3/20", "4/20", "5/20", "6/20", "7/20", "8/20", "9/20", "10/20", "11/20", "12/20", "13/20", "14/20", "15/20", "16/20", "17/20", "18/20", "19/20", "20/20", "dev 1/2", "dev 2/2"]
    name: ${{ startsWith(matrix.suite, 'dev') && matrix.suite || format('shard {0}', matrix.suite) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: $/.github/actions/playwright-chromium
      - run: npm run sync-docs
      - name: Run the suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          case "${SUITE}" in
            # One spec file imports the others, so shard by test, not by file.
            "dev "*) npm run test:dev -- --shard="${SUITE#dev }" --fully-parallel ;;
            *) npm run test:browser -- --shard="${SUITE}" --workers=1 ;;
          esac
      # Playwright keeps a trace, a screenshot and the error context of every
      # failed test (trace: retain-on-failure), and they are what explains a
      # failure the log only reports as "Received: false". Without this they
      # are thrown away with the runner. Artifact names cannot contain the
      # suite's "/", so the matrix index and attempt keep them apart.
      - name: Upload the failed tests' traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failures-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: |
            .builds/test-results
            .builds/dev-results
          retention-days: 7
          if-no-files-found: ignore
