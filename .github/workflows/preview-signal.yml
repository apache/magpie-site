---
# A doorbell for preview-publish.yml, and nothing more.
#
# PR events that do not start a build — a label added or removed, a PR
# closed — still need the privileged publisher to run. A `pull_request` run
# holds no privileges, so this one does nothing at all: it has no permissions,
# checks nothing out and runs no code. Its only effect is that it completes,
# which fires preview-publish.yml's `workflow_run` trigger in the default
# branch's context, where the publisher reconciles every preview from the API.
name: "Preview signal"
"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, labeled, unlabeled, closed]

permissions: {}

jobs:
  signal:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Signal the preview publisher
        run: echo "preview-publish.yml runs on this workflow's completion"
