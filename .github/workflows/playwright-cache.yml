---
# Saves the browser suites' Playwright apt cache on main. A pull request can
# restore caches saved on main but not another PR's, and pushes to main skip
# the browser suites, so nothing else saves one there. The weekly run picks up
# Ubuntu package updates and keeps the entry from being evicted after 7 unused
# days, even when no push changes package-lock.json.
name: "Playwright cache"
"on":
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-cache
  cancel-in-progress: true

jobs:
  playwright-cache:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: $/.github/actions/playwright-chromium
