---
# The only job that saves the browser suites' Playwright apt cache; the
# shards just restore it. Weekly on main, ahead of build.yml's scheduled run,
# it saves that week's entry with the latest Ubuntu updates; a pull request can
# restore caches saved on main. Run it by hand to seed a missing cache.
#
# It runs on ubuntu-latest, which has no 15-minute cap, so a slow mirror only
# slows it down, inside the plain Ubuntu image that ubuntu-slim is built FROM:
# the ubuntu-latest image has most of these packages installed already, so apt
# there would not download, and the cache would not hold, what the shards
# need. ubuntu-slim is not published as an image, so slim-release asks an
# ubuntu-slim runner which Ubuntu release it is, and the cache job fails unless
# its container is that release: when GitHub moves ubuntu-slim to a new one,
# update `container` below.
name: "Playwright cache"
"on":
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-cache
  cancel-in-progress: true

jobs:
  slim-release:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      image: ${{ steps.release.outputs.image }}
    steps:
      - id: release
        run: |
          . /etc/os-release
          echo "ubuntu-slim ${ImageVersion:-unknown} is ${PRETTY_NAME}"
          echo "image=${ID}:${VERSION_ID}" >> "${GITHUB_OUTPUT}"

  playwright-cache:
    needs: slim-release
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 45
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check the container is ubuntu-slim's release
        env:
          SLIM: ${{ needs.slim-release.outputs.image }}
        run: |
          . /etc/os-release
          if [ "${ID}:${VERSION_ID}" != "${SLIM}" ]; then
            echo "::error::ubuntu-slim is now ${SLIM}, but this job runs in ${ID}:${VERSION_ID}; set its container to ${SLIM}"
            exit 1
          fi
      # actions/cache compresses with zstd when it is installed and gzip
      # otherwise, and a cache only restores with the method it was saved
      # with. ubuntu-slim has zstd, the plain image does not.
      - name: Install zstd, as the shards restoring the cache have it
        run: apt-get update && apt-get install -y zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: $/.github/actions/playwright-chromium
        with:
          save: "true"
