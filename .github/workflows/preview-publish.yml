---
# Privilege boundary — read this before changing any trigger.
#
# This workflow holds a GITHUB_TOKEN that can push branches to an ASF
# repository and comment on pull requests, so it must never check out, build,
# or execute code from a pull request, and never read anything from the PR's
# tree. It only ever runs scripts from this repository's own default branch,
# which consume an already-built artifact produced by the unprivileged
# `pull_request` run in build.yml (and screened by validate.mjs before use).
#
# The optional pull_request_target trigger exists only to learn "a pull
# request was pushed to" quickly. Under pull_request_target, actions/checkout
# with no `ref` checks out the BASE branch, which is what is wanted: no job
# here sets `ref`, and none may ever point it at github.event.pull_request.*.
# The only values taken from the event are the PR number and head SHA, both
# passed through env and validated as digits / 40-hex before use. The trigger
# never arms a preview: --if-armed publishes only what a maintainer armed.
#
# Another site adopting this publisher can drop the pull_request_target
# trigger and the await-build job; the schedule alone still publishes, only
# later.
name: "Publish PR previews"
"on":
  schedule:
    - cron: "*/5 * * * *"
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- base-branch code only; see header
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: "Publish only this PR number (skips the armed check)"
        required: false
        type: string

permissions: {}

jobs:
  # pull_request_target only: wait for the unprivileged build of the pushed
  # commit, so a sticky preview is republished minutes after its build rather
  # than on the next scheduled run. Holds no write permission, and runs outside
  # the publish concurrency group so a long wait never blocks scheduled runs.
  await-build:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-slim
    timeout-minutes: 55
    permissions:
      contents: read # read the preview branch's head commit
      actions: read # read build.yml runs for the head SHA
    concurrency:
      # A newer push to the same PR supersedes the wait for an older one.
      group: preview-await-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      ready: ${{ steps.wait.outputs.ready }}
    steps:
      - name: Checkout the base branch (never the pull request)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Wait for the build of the pushed commit
        id: wait
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/preview/await-build.mjs

  publish:
    needs: await-build
    # await-build is skipped on schedule and dispatch; !cancelled() lets this
    # job run anyway, and on pull_request_target it runs only once the build
    # is green.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request_target' || needs.await-build.outputs.ready == 'true')
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      # push, force-push and delete preview/* branches, and delete this repo's
      # head branches once all their pull requests have closed
      contents: write
      # Commenting on a PULL REQUEST needs pull-requests: write, even though the
      # endpoint is /issues/{n}/comments. issues: write covers issues only — with
      # it alone every comment 403s, which is exactly what happened on the first
      # scheduled run (actions/runs/35148520846).
      pull-requests: write # list open PRs, read head SHAs, and post PR comments
      issues: write # the same endpoints when the target is a real issue
      actions: read # list and download build.yml's artifacts
    concurrency:
      group: preview-publish
      cancel-in-progress: false
    steps:
      - name: Checkout the base branch (never the pull request)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Publish and reap previews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_INPUT: ${{ inputs.pr }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "${EVENT_PR}" ]; then
            node scripts/preview/publish.mjs --pr "${EVENT_PR}" --if-armed
          elif [ -n "${PR_INPUT}" ]; then
            node scripts/preview/publish.mjs --pr "${PR_INPUT}"
          else
            node scripts/preview/publish.mjs
          fi
