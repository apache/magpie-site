---
# This workflow is deliberately NOT pull_request_target.
#
# It holds a GITHUB_TOKEN that can push branches to an ASF repository and
# comment on pull requests, so it must never check out, build, or execute
# code from a pull request — that is exactly what pull_request_target would
# hand it, along with a fork's arbitrary contents, on a privileged token. It
# only ever runs `node scripts/preview/publish.mjs`, which consumes an
# already-built artifact produced by the unprivileged `pull_request` run in
# build.yml and never checks out PR code itself. If a future change seems to
# need pull_request_target, that is a sign the artifact boundary is being
# bypassed, not a reason to add it here.
name: "Publish PR previews"
"on":
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Publish only this PR number (skips the armed check)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: preview-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Publish and reap previews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_INPUT: ${{ inputs.pr }}
        run: |
          if [ -n "${PR_INPUT}" ]; then
            node scripts/preview/publish.mjs --pr "${PR_INPUT}"
          else
            node scripts/preview/publish.mjs
          fi
