---
# Privilege boundary — read this before changing any trigger.
#
# This workflow holds a GITHUB_TOKEN that can push branches to an ASF
# repository, label pull requests and comment on them, so it must never check
# out, build, or execute code from a pull request, and never read anything
# from the PR's tree. It only ever runs scripts from this repository's own
# default branch, which consume an already-built artifact produced by the
# unprivileged `pull_request` run in build.yml (screened by validate.mjs).
#
# It does not use pull_request_target. Its triggers are signals only:
#   - workflow_run fires when build.yml or preview-signal.yml completes for a
#     pull request. It always runs this file from the default branch — that
#     is the property that makes it safe — and fires the moment a build
#     finishes, so a push to an armed PR publishes with no waiting or polling.
#     preview-signal.yml covers the PR events that start no build (label
#     added or removed, PR closed).
#   - issue_comment fires on any PR comment, so a /show-preview command
#     publishes at once when the build is already green. The comment itself is
#     not inspected here; the publisher finds commands through the API.
# Nothing is taken from any event into a step. The `if:` below reads only the
# event name, the triggering run's event type and whether the issue is a PR —
# never a title, body, branch name, SHA or comment text. No trigger arms
# anything: the publisher re-derives arming from the API — the `preview`
# label, added by someone with write access.
#
# What the publisher may read about a pull request is fixed by the
# projections in scripts/preview/github.mjs: PR number, label names, head SHA,
# author login/type, and comment bodies only when they are the exact
# /show-preview command or bot-authored. Plus the build's artifact, screened
# and never executed. scripts/preview/boundary.test.mjs checks this file, and
# the client's endpoints and projections, deterministically on every PR.
#
# Every run is a full reconcile of all open pull requests and preview
# branches, so a run that concurrency drops is covered by the next one. A run
# that fails part-way is retried by the next event on any PR, or by a manual
# dispatch with no PR number.
name: "Publish PR previews"
"on":
  workflow_run: # zizmor: ignore[dangerous-triggers] -- default-branch code, no PR input; see header
    workflows: ["Build and Deploy", "Preview signal"]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "Arm and publish this PR number (blank: reconcile every PR)"
        required: false
        type: string

permissions: {}

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-slim
    # ubuntu-slim stops every job at 15 minutes; a larger value only misleads.
    timeout-minutes: 15
    permissions:
      # push, force-push and delete preview/* branches, and delete this repo's
      # head branches once all their pull requests have closed
      contents: write
      # Commenting on a PULL REQUEST needs pull-requests: write, even though the
      # endpoint is /issues/{n}/comments. issues: write covers issues only — with
      # it alone every comment 403s, which is exactly what happened on the first
      # scheduled run (actions/runs/35148520846).
      pull-requests: write # list open PRs, post comments, add the preview label
      issues: write # create the label, react to comments, and the same endpoints on issues
      actions: read # list and download build.yml's artifacts
    concurrency:
      group: preview-publish
      cancel-in-progress: false
    steps:
      - name: Checkout the default branch (never the pull request)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Publish and reap previews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_INPUT: ${{ inputs.pr }}
        run: |
          if [ -n "${PR_INPUT}" ]; then
            node scripts/preview/publish.mjs --pr "${PR_INPUT}"
          else
            node scripts/preview/publish.mjs
          fi
